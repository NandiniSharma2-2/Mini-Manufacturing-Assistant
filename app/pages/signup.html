
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Create Account | Manufacturing AI</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../../css/style.css?v=20261103-warm">
  <link rel="stylesheet" href="../css/app.css?v=20261103-warm">

  <style>
    body {
      background: #0e0f11;
      color: #f5f2eb;
      font-family: var(--font-main);
    }

    .signup-container {
      max-width: 480px;
      margin: 65px auto;
      padding: 35px;
      background: #181a1e;
      border: 1px solid #343434;
      border-radius: 8px;
    }

    .brand {
      color: #c9a66c;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .signup-container h1 {
      font-size: 30px;
      margin: 20px 0;
    }

    .signup-container label {
      display: block;
      margin: 15px 0 7px;
      color: #c9a66c;
      font-size: 12px;
      font-weight: bold;
    }

    .signup-container input {
      width: 100%;
      padding: 12px;
      background: #111316;
      color: white;
      border: 1px solid #454545;
      border-radius: 4px;
    }

    .signup-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #c9a66c;
      color: #111;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    #message {
      margin-top: 16px;
      min-height: 22px;
    }

    a {
      color: #c9a66c;
    }
  </style>
</head>

<body>
  <main class="signup-container">

    <div class="brand">MANUFACTURING.AI</div>

    <h1>Create Account</h1>

    <p>Register as an Engineer to submit and track product inspections.</p>

    <form id="signupForm">

      <label for="firstName">FIRST NAME</label>
      <input id="firstName" required>

      <label for="lastName">LAST NAME</label>
      <input id="lastName" required>

      <label for="username">USERNAME</label>
      <input id="username" autocomplete="username" required>

      <label for="email">EMAIL ADDRESS</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">PASSWORD</label>
      <input id="password" type="password"
             autocomplete="new-password" required>

      <label for="confirmPassword">CONFIRM PASSWORD</label>
      <input id="confirmPassword" type="password"
             autocomplete="new-password" required>

      <button class="signup-button" type="submit">
        CREATE ACCOUNT
      </button>

      <p id="message" role="status"></p>
    </form>

    <p class="text-center mt-4">
      Already have an account?
      <a href="login.html">Sign In</a>
    </p>

  </main>

  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const password2 =
        document.getElementById("confirmPassword").value;

      if (password !== password2) {
        message.textContent = "Passwords do not match.";
        return;
      }

      const payload = {
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        first_name: document.getElementById("firstName").value.trim(),
        last_name: document.getElementById("lastName").value.trim(),
        password: password,
        password2: password2,
        role: "ENGINEER"
      };

      message.textContent = "Creating account...";

      try {
        const response = await fetch(
          "http://127.0.0.1:8000/api/accounts/register/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          }
        );

        const data = await response.json();

        if (!response.ok) {
          const details = Object.entries(data)
            .map(([key, value]) =>
              `${key}: ${Array.isArray(value) ? value.join(", ") : value}`
            )
            .join(" | ");

          throw new Error(details || "Registration failed");
        }

        message.style.color = "#83d9a7";
        message.textContent =
          "Account created! Redirecting to Sign In...";

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1200);

      } catch (error) {
        message.style.color = "#ff8585";
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
