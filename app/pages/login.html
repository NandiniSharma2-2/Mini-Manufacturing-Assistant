
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Manufacturing AI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Application CSS -->
    <link rel="stylesheet" href="../../css/style.css?v=20261103-warm">
    <link rel="stylesheet" href="../css/app.css?v=20261103-warm">
</head>

<body>

    <main class="login-page">

        <a href="../../index.html" class="login-brand">
            <span class="login-brand-symbol">M</span>
            MANUFACTURING<span>.AI</span>
        </a>

        <div class="login-container">

            <div class="login-heading">
                <p class="section-label">SECURE WORKSPACE ACCESS</p>
                <h1>WELCOME<br>BACK.</h1>
                <p>Access your manufacturing intelligence workspace.</p>
            </div>

            <div class="login-panel">

                <div class="login-panel-header">
                    <span>PLATFORM ACCESS</span>
                    <span class="system-status">● SYSTEM ONLINE</span>
                </div>

                <form id="loginForm">

                    <label for="email">USERNAME OR EMAIL ADDRESS</label>
                    <input
    type="text"
    id="email"
    placeholder="Enter your username or account email"
    autocomplete="username"
    required
>

                    <label for="password">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <label for="role">ACCESS ROLE</label>
                    <select id="role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="administrator">Administrator</option>
                        <option value="engineer">Engineer</option>
                        <option value="supervisor">Supervisor</option>
                    </select>

                    <button type="submit" class="login-submit">
                        ACCESS WORKSPACE <span>↗</span>
                    </button>
                    <p id="loginMessage"
   style="margin-top:15px; color:#d6ad70;"
   role="status"></p>
                    <p style="text-align:center; margin-top:20px;">
  Don't have an account?
  <a href="signup.html" style="color:#c9a66c;">
    Create Account
  </a>
</p>

                </form>

                <div class="login-security">
                    <span>SECURE ACCESS</span>
                    <span>ROLE-BASED AUTHORIZATION</span>
                </div>

            </div>

        </div>

        <footer class="login-footer">
            © 2026 MANUFACTURING AI · ALL RIGHTS RESERVED
        </footer>

    </main>
<script src="../../js/api.js?v=20261103-login-email"></script>
<script src="../../js/login-connect.js?v=20261103-login-email"></script>
</body>
</html>
